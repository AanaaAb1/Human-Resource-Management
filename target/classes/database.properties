# HRM System Database Configuration
# PostgreSQL Configuration

# Database Type: postgresql
db.type=postgresql

# PostgreSQL Connection Settings
# Default values - override with environment variables for production
db.url=jdbc:postgresql://localhost:5432/hrm_system
db.username=postgres
db.password=password

# Connection Pool Settings
db.pool.size=10
db.pool.timeout=30000
db.pool.idle=5

# Connection Test Settings
db.test.query=SELECT 1

# SSL Settings (set to true for production)
db.ssl.enabled=false
db.ssl.mode=prefer

# Hibernate/DDL Settings (for future use)
# hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# hibernate.hbm2ddl.auto=update

